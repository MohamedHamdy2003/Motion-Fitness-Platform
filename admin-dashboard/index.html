<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#008657" />
    <meta
      name="description"
      content="Motion — بوابة إدارة البرامج التدريبية والتغذية والمطابقة الذكية وتحليلات المنصة."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Motion - الإدارة</title>
    <script>
      (function () {
        try {
          var saved = window.localStorage.getItem('motion.admin.theme.v1');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (saved === 'dark') {
            document.documentElement.dataset.theme = 'dark';
            if (meta) meta.setAttribute('content', '#0f1019');
          } else if (saved === 'lime') {
            document.documentElement.dataset.theme = 'lime';
            if (meta) meta.setAttribute('content', '#a8ec17');
          }
        } catch (_err) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
