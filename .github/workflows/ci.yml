name: Green CI
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  backend-checks:
    name: backend-checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: motion
          POSTGRES_PASSWORD: ci_disposable_password
          POSTGRES_DB: motion_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U motion -d motion_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://motion:ci_disposable_password@localhost:5432/motion_test
      TEST_DATABASE_URL: postgres://motion:ci_disposable_password@localhost:5432/motion_test
      JWT_SECRET: ci-only-disposable-signing-key-never-use-in-staging
      MAIL_MODE: capture
      MAIL_ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run bruno:check
      - run: npm test
      - run: npm run build
      - name: Validate AWS deployment assets
        run: |
          bash -n deployment/deploy-aws.sh
          bash -n deployment/update-aws.sh
          cp deployment/aws.env.example .env.aws
          MOTION_IMAGE=motion-api:ci docker compose --env-file .env.aws -f deployment/compose.aws.yaml config --quiet
          rm .env.aws
      - name: Build and verify deployment image
        run: |
          docker build -t motion-api:ci .
          docker run --rm motion-api:ci node -e "require('argon2'); require('@aws-sdk/client-s3'); require('pg'); console.log('Deployment runtime dependencies ready')"
      - run: npm run migration:run
      - run: npm run seed:lookups && npm run seed:lookups && npm run seed:content
      - run: npm run test:integration
      - name: Run Bruno against the real API
        run: |
          npm start > /tmp/motion-api.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:3100/api/v1/health/ready; then break; fi
            sleep 1
          done
          npm run bruno
  private-ai-checks:
    name: private-ai-checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ai-service/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  deploy-production:
    name: Deploy EC2
    needs: [backend-checks, private-ai-checks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    concurrency:
      group: motion-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Deploy the tested commit over verified SSH
        shell: bash
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_USER: ${{ vars.EC2_USER }}
          EC2_PROJECT_PATH: ${{ vars.EC2_PROJECT_PATH }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_SSH_KNOWN_HOSTS: ${{ secrets.EC2_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          [[ "$EC2_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]] || { echo 'Set EC2_HOST'; exit 1; }
          [[ "$EC2_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]] || { echo 'Set EC2_USER'; exit 1; }
          [[ "$EC2_PROJECT_PATH" =~ ^/[a-zA-Z0-9_./-]+$ ]] || { echo 'Set absolute EC2_PROJECT_PATH without spaces'; exit 1; }
          [[ -n "$EC2_SSH_PRIVATE_KEY" && -n "$EC2_SSH_KNOWN_HOSTS" ]] || { echo 'Configure SSH secrets in production'; exit 1; }
          keydir=$(mktemp -d)
          trap 'rm -rf "$keydir"' EXIT
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > "$keydir/key"
          printf '%s\n' "$EC2_SSH_KNOWN_HOSTS" > "$keydir/known_hosts"
          chmod 600 "$keydir/key" "$keydir/known_hosts"
          ssh -i "$keydir/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$keydir/known_hosts" \
            -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "$EC2_USER@$EC2_HOST" "bash -s -- '$GITHUB_SHA' '$EC2_PROJECT_PATH'" \
            < deployment/update-aws.sh
