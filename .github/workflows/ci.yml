name: Green CI
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  backend-checks:
    name: backend-checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: motion
          POSTGRES_PASSWORD: ci_disposable_password
          POSTGRES_DB: motion_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U motion -d motion_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://motion:ci_disposable_password@localhost:5432/motion_test
      TEST_DATABASE_URL: postgres://motion:ci_disposable_password@localhost:5432/motion_test
      JWT_SECRET: ci-only-disposable-signing-key-never-use-in-staging
      MAIL_MODE: capture
      MAIL_ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run bruno:check
      - run: npm test
      - run: npm run build
      - name: Validate AWS deployment assets
        run: |
          bash -n deployment/deploy-aws.sh
          bash -n deployment/update-aws.sh
          python3 -B -m unittest discover -s deployment -p 'test_*.py'
          cp deployment/aws.env.example .env.aws
          MOTION_IMAGE=motion-api:ci docker compose --env-file .env.aws -f deployment/compose.aws.yaml config --quiet
          rm .env.aws
          docker run --rm -v "$PWD/deployment/Caddy.aws:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Build and verify deployment image
        run: |
          docker build -t motion-api:ci .
          docker run --rm motion-api:ci node -e "require('argon2'); require('@aws-sdk/client-s3'); require('pg'); console.log('Deployment runtime dependencies ready')"
      - run: npm run migration:run
      - run: npm run seed:lookups && npm run seed:lookups && npm run seed:content
      - run: npm run test:integration
      - name: Run Bruno against the real API
        run: |
          npm start > /tmp/motion-api.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:3100/api/v1/health/ready; then break; fi
            sleep 1
          done
          npm run bruno
  private-ai-checks:
    name: private-ai-checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ai-service/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  deploy-production:
    name: Deploy EC2
    needs: [backend-checks, private-ai-checks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 35
    permissions:
      contents: read
    concurrency:
      group: motion-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate with the dedicated deployment IAM user
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: '290181458132'
      - name: Deploy the tested commit through SSM
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          EC2_USER: ${{ vars.EC2_USER }}
          EC2_PROJECT_PATH: ${{ vars.EC2_PROJECT_PATH }}
        run: python3 deployment/send-ssm.py
