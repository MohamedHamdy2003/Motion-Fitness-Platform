services:
  api:
    image: ${MOTION_IMAGE:?Run deployment/deploy-aws.sh}
    env_file: ../.env.aws
    environment:
      NODE_ENV: production
      PORT: 3100
      DATABASE_SSL: 'true'
      DATABASE_CA_CERT_PATH: /run/certs/rds-ca.pem
      TRUST_PROXY: 'true'
    volumes:
      - ../.local/rds-ca.pem:/run/certs/rds-ca.pem:ro
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    init: true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3100/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6

  caddy:
    image: caddy:2-alpine
    environment:
      API_DOMAIN: ${API_DOMAIN:-13.49.114.20}
    ports: ['80:80', '443:443', '443:443/udp']
    volumes:
      - ./Caddy.aws:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  caddy_data:
  caddy_config:
