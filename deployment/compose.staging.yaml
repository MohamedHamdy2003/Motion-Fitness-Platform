services:
  api:
    build:
      context: ..
    env_file: ../.env.staging
    command:
      [
        'sh',
        '-c',
        'node dist/infrastructure/database/migrate.js && exec node dist/main.js',
      ]
    expose: ['3100']
    restart: unless-stopped
    networks: [edge, private_ai]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3100/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      start_period: 60s
      retries: 3
  proxy:
    image: caddy:2-alpine
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set the staging hostname pointing to this VM}
    ports: ['80:80', '443:443']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    restart: unless-stopped
  ai:
    profiles: [rewrite]
    build:
      context: ../ai-service
    env_file: ../.env.ai
    environment:
      AI_SERVICE_HOST: 0.0.0.0
      AI_SERVICE_PORT: 3001
    expose: ['3001']
    networks: [private_ai, ai_egress]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
networks:
  edge:
  private_ai:
    internal: true
  ai_egress:
volumes:
  caddy_data:
  caddy_config:
