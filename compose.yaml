services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: motion
      POSTGRES_USER: motion
      POSTGRES_PASSWORD: motion_local_only
    ports: ['127.0.0.1:55432:5432']
    volumes: ['motion_pg:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U motion -d motion']
      interval: 3s
      retries: 20
volumes:
  motion_pg:
